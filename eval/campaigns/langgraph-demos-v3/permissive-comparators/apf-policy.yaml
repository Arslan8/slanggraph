apiVersion: nvidia.agent-policy-fabric.sandbox/v1alpha1
kind: SandboxPolicy
metadata:
  name: permissive-comparator
  description: Deliberately insecure lower-bound policy for the matched 15-application campaign
spec:
  filesystem:
    include_workdir: true
    read_only:
      - /bin
      - /usr
      - /lib
      - /lib64
      - /etc
      - /proc
      - /dev/urandom
      - /home/faculty/abk6349/.local/share/uv
    read_write:
      - /data/langgraph
      - /workspace
      - /tmp
      - /dev/null
  landlock:
    compatibility: best_effort
  process:
    run_as_user: "1001"
    run_as_group: "1001"
  network_policies:
    model-relay:
      name: unrestricted-local-model-relay
      endpoints:
        - host: host.openshell.internal
          port: 11435
          protocol: tcp
      binaries:
        - path: /home/faculty/abk6349/.local/share/uv/python/cpython-3.11.14-linux-x86_64-gnu/bin/python3.11
