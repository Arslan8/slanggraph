apiVersion: nvidia.agent-policy-fabric.sandbox/v1alpha1
kind: SandboxPolicy
metadata:
  name: matched-authority-comparator
  description: Enforceable host policy for the matched 15-application campaign
spec:
  filesystem:
    include_workdir: false
    read_only:
    - /bin
    - /usr
    - /lib
    - /lib64
    - /etc
    - /proc
    - /dev/urandom
    - /home/faculty/abk6349/.local/share/uv
    - /data/langgraph/eval/.venv
    - /data/langgraph/eval/src
    - /data/langgraph/eval/apps/demos
    - /data/langgraph/eval/campaigns/langgraph-demos-v3/permissive-comparators/model_relay.py
    - /data/langgraph/libs
    read_write:
    - /workspace
    - /tmp
    - /dev/null
  landlock:
    compatibility: best_effort
  process:
    run_as_user: '1001'
    run_as_group: '1001'
  network_policies:
    model-relay:
      name: local-model-relay-only
      endpoints:
      - host: host.openshell.internal
        port: 11435
        protocol: tcp
      binaries:
      - path: /home/faculty/abk6349/.local/share/uv/python/cpython-3.11.14-linux-x86_64-gnu/bin/python3.11
