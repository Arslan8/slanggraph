name: slangGraph security gates

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/slanggraph-security.yml"
      - "libs/prebuilt/**"
      - "libs/langgraph/**"
      - "docs/security/**"
  push:
    branches:
      - course/security-modules
    paths:
      - ".github/workflows/slanggraph-security.yml"
      - "libs/prebuilt/**"
      - "libs/langgraph/**"
      - "docs/security/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: libs/prebuilt

jobs:
  security-quality:
    name: Security package quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: ./.github/actions/uv_setup
        with:
          python-version: "3.13"
          cache-suffix: slanggraph-security-quality
          working-directory: libs/prebuilt
      - name: Install dependencies
        run: uv sync --frozen
      - name: Run package lint
        run: make lint
      - name: Verify bounded host-dispatch claims (not overall completeness)
        run: >-
          uv run python -m langgraph.prebuilt.security.mediation
          --check-claims --output mediation-report.json
      - name: Verify complete host-only routing and cross-tool mediation
        if: always()
        run: >-
          uv run python -m langgraph.prebuilt.security.boundary_verification
          --output host-router-certificate.json
      - name: Require zero or individually reviewed escape findings
        run: >-
          uv run python -m langgraph.prebuilt.security.taint
          langgraph/prebuilt ../../libs/langgraph/langgraph
          --waivers ../../docs/security/escape-waivers.json
          --json
      - name: Reject known implementation regressions and report proof gaps
        if: always()
        run: make security-verify-regressions
      - name: Check finite denial and original-binding permutations
        if: always()
        run: make security-verify-permutations
      - name: Check Tool API conformance
        if: always()
        run: >-
          uv run python -m langgraph.prebuilt.security.tool_api_verifier
          --output tool-api-report.json
      - name: Upload authorization coverage and unresolved obligations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mediation-report-${{ github.sha }}
          path: |
            libs/prebuilt/mediation-report.json
            libs/prebuilt/security-verification-report.json
            libs/prebuilt/security-permutation-report.json
            libs/prebuilt/tool-api-report.json
            libs/prebuilt/host-router-certificate.json
      - name: Run supported security-package type check
        run: make type

  security-coverage:
    name: Security package branch coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: ./.github/actions/uv_setup
        with:
          python-version: "3.13"
          cache-suffix: slanggraph-security-coverage
          working-directory: libs/prebuilt
      - name: Install dependencies
        run: uv sync --frozen --group test --no-dev
      - name: Install Linux sandbox dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap libseccomp2
          if [ "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - name: Enforce security-package branch coverage
        # Ratchet from the measured phase-one branch-coverage baseline.
        run: >-
          uv run pytest tests/security
          --cov=langgraph.prebuilt.security
          --cov-branch
          --cov-report=term-missing
          --cov-fail-under=78

  tool-node-benchmark:
    name: ToolNode benchmark baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python 3.13
        uses: ./.github/actions/uv_setup
        with:
          python-version: "3.13"
          cache-suffix: slanggraph-tool-node-benchmark
          working-directory: libs/prebuilt
      - name: Install dependencies
        run: uv sync --frozen --group test --no-dev
      - name: Run benchmark
        run: >-
          uv run pytest benchmarks
          --benchmark-only
          --benchmark-warmup=on
          --benchmark-warmup-iterations=100
          --benchmark-disable-gc
          --benchmark-json=tool-node-benchmark.json
      - name: Upload benchmark result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tool-node-benchmark-${{ github.sha }}
          path: libs/prebuilt/tool-node-benchmark.json
